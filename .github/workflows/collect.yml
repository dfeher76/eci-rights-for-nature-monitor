name: Collect ECI signature counts

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC)
  workflow_dispatch:       # allows a manual start from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch signature counts
        run: |
          mkdir -p data
          ECI_OUT_DIR=data python eci_collector.py

      - name: Save new data
        run: |
          git config user.name "eci-monitor"
          git config user.email "eci-monitor@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update signature data"
            git push
          fi
